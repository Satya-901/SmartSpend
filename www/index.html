<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SmartSpend</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAF5EE;
            color: #28221D;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .brand-icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: #FFF3E6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(255, 167, 38, 0.2);
            font-size: 38px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 0.95rem;
            color: #6A6055;
            max-width: 320px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid rgba(255, 167, 38, 0.25);
            border-top-color: #FFA726;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-retry {
            display: none;
            background: linear-gradient(135deg, #FFA726 0%, #FB8C00 100%);
            color: #FFFFFF;
            border: none;
            padding: 12px 30px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 167, 38, 0.35);
        }
    </style>
</head>
<body>
    <div class="brand-icon">💳</div>
    <div class="spinner" id="loader"></div>
    <h1 id="title">Connecting to SmartSpend...</h1>
    <p id="desc">Loading your secure financial workspace</p>
    <button class="btn-retry" id="retryBtn" onclick="tryConnect()">Retry Connection</button>

    <script>
        const REMOTE_URL = "https://orangered-sardine-855758.hostingersite.com/";

        function tryConnect() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('retryBtn').style.display = 'none';
            document.getElementById('title').textContent = 'Connecting to SmartSpend...';
            document.getElementById('desc').textContent = 'Loading your secure financial workspace';

            fetch(REMOTE_URL, { mode: 'no-cors', cache: 'no-store' })
                .then(() => {
                    window.location.replace(REMOTE_URL);
                })
                .catch(() => {
                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('retryBtn').style.display = 'inline-block';
                        document.getElementById('title').textContent = 'No Internet Connection';
                        document.getElementById('desc').textContent = 'Please check your Wi-Fi or mobile data connection and tap Retry.';
                    }, 1200);
                });
        }

        window.addEventListener('online', tryConnect);
        tryConnect();
    </script>
</body>
</html>
