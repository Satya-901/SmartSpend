name: Build Final Android Release APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Release APK and Play Store AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign Final Release APK
        run: |
          mkdir -p final-builds
          
          # Generate signing keystore
          keytool -genkey -v -keystore release.keystore -alias smartspend -keyalg RSA -keysize 2048 -validity 10000 -storepass smartspend123 -keypass smartspend123 -dname "CN=SmartSpend, OU=Finance, O=SmartSpend, L=Delhi, S=Delhi, C=IN"
          
          # Locate Android Build Tools (apksigner & zipalign)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Build Tools from: $BUILD_TOOLS_DIR"
          
          # Align APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk final-builds/app-release-aligned.apk
          
          # Sign APK with v1 + v2 + v3 schemes
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:smartspend123 --ks-key-alias smartspend --key-pass pass:smartspend123 --out final-builds/SmartSpend-Final-Release.apk final-builds/app-release-aligned.apk
          
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify final-builds/SmartSpend-Final-Release.apk
          
          # Copy Play Store AAB bundle
          cp android/app/build/outputs/bundle/release/app-release.aab final-builds/SmartSpend-PlayStore-Bundle.aab

      - name: Upload Final Release APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: SmartSpend-Final-Release-APK
          path: final-builds/SmartSpend-Final-Release.apk
          retention-days: 30

      - name: Upload Play Store AAB Bundle (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: SmartSpend-PlayStore-AAB
          path: final-builds/SmartSpend-PlayStore-Bundle.aab
          retention-days: 30
